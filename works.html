<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลงานและกิจกรรม | วรภพ เทียนทอง</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body>

  <section class="works-hero">
    <h1>ผลงานและกิจกรรมของฉัน</h1>
    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> กลับหน้าแรก
    </a>
  </section>

  <!--
    ด้านล่างคือ "การ์ดผลงาน" ตัวอย่าง 3 อัน ให้แก้ไข:
      - src ของ <img> ให้เป็นรูปกิจกรรม/ผลงานจริง (วางไฟล์ไว้ใน works-images/)
      - หัวข้อใน <h3> และคำอธิบายใน <p>
    จะเพิ่มหรือลบการ์ดกี่อันก็ได้ โดยคัดลอกทั้งบล็อก <article class="work-card">...</article>
  -->
  <main class="works-grid">

    <article class="work-card">
      <img src="speech certi.jpg" alt="การแข่งขันทักษะการพูดภาษาอังกฤษ" />
      <h3>การแข่งขันทักษะภาษาอังกฤษ</h3>
      <p>รายละเอียดสั้น ๆ เกี่ยวกับผลงานหรือกิจกรรมนี้</p>
    </article>

    <article class="work-card">
      <img src="teach certi.jpg" alt="การฝึกการสอน" />
      <h3>การฝึกการสอน</h3>
      <p>รายละเอียดสั้น ๆ เกี่ยวกับผลงานหรือกิจกรรมนี้</p>
    </article>

    <article class="work-card">
      <img src="student certi.jpg" alt="คณะกรรมการสภานักเรียน" />
      <h3>คณะกรรมการสภานักเรียน</h3>
      <p>รายละเอียดสั้น ๆ เกี่ยวกับผลงานหรือกิจกรรมนี้</p>
    </article>

  </main>

</body>
</html>
